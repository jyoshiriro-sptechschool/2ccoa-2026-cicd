user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;

    server {
        listen 80 default_server;

        # Redirecionamento de /api para o backend específico
        location /api/ {
            # proxy_pass para o IP e Porta do seu backend
            # O '/' no final do 'proxy_pass' é crucial. Ele remove a parte correspondente
            # do 'location' (ou seja, "/api/") antes de enviar para o upstream.
            # Ex: Chamada para /api/users -> Redireciona para http://DESTINO:PORTA/users
            proxy_pass http://api.backend:8080/;

            # Configurações de proxy padrão (recomendado)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

         # Tratamento para outras requisições (ex: servir um frontend ou página padrão)
        location / {
            # Exemplo: Servir uma página HTML estática padrão
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ =404;
        }
    }
}